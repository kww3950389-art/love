<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Burst Animation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0d0d0d;
    }

    /* Скрываем чекбокс */
    #toggle-heart {
      display: none;
    }

    /* Контейнер */
    .heart-container {
      position: relative;
      display: inline-block;
    }

    /* Сердце по умолчанию */
    label {
      font-size: 100px;
      cursor: pointer;
      color: transparent;
      -webkit-text-stroke: 2px #ccc; /* обводка */
      transition: all 0.3s ease;
      user-select: none;
      display: inline-block;
    }

    /* При клике */
    #toggle-heart:checked + label {
      color: #ff0033;
      -webkit-text-stroke: 2px #ff0033;
      animation: heart 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49);
    }

    /* Маленькие сердечки */
    .burst {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #ff0033;
      opacity: 0;
      pointer-events: none;
    }

    /* Когда кликаем — запускаем всплеск */
    #toggle-heart:checked ~ .burst span {
      position: absolute;
      opacity: 1;
      animation: fly 0.8s forwards;
    }

    /* Каждое сердечко в свою сторону */
    .burst span:nth-child(1) { animation-delay: 0s;   --x: -80px; --y: -80px; }
    .burst span:nth-child(2) { animation-delay: 0.05s; --x: 80px;  --y: -80px; }
    .burst span:nth-child(3) { animation-delay: 0.1s;  --x: -80px; --y: 80px; }
    .burst span:nth-child(4) { animation-delay: 0.15s; --x: 80px;  --y: 80px; }
    .burst span:nth-child(5) { animation-delay: 0.2s;  --x: 0px;   --y: -100px; }
    .burst span:nth-child(6) { animation-delay: 0.25s; --x: 0px;   --y: 100px; }

    /* Анимация полета */
    @keyframes fly {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2);
        opacity: 0;
      }
    }

    /* Анимация пульсации сердца */
    @keyframes heart {
      0%   { transform: scale(1); }
      25%  { transform: scale(1.3); }
      50%  { transform: scale(0.9); }
      75%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="heart-container">
    <input type="checkbox" id="toggle-heart">
    <label for="toggle-heart" onclick="window.location.href='https://www.example.com';">❤</label>

    <!-- Всплеск сердечек -->
    <div class="burst">
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
      <span>❤</span>
    </div>
  </div>
  
  <script>
    // При клике на сердечко будет выполняться редирект на указанный сайт.
    document.querySelector('label').addEventListener('click', function() {
      window.location.href = 'https://www.example.com'; // Укажите нужный URL
    });
  </script>
</body>
</html>
